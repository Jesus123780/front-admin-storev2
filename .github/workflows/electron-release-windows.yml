
name: Venty - Windows Release

# Un push normal a main NO publica instaladores.
# Manual = compilacion de prueba. Tag v* = publicacion.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: venty-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Venty Windows NSIS
    runs-on: windows-2022
    timeout-minutes: 150

    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NEXT_TELEMETRY_DISABLED: '1'

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Fallo npm ci del frontend' }

      - name: Validate release version
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo leer la version' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version no admitida: $version"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $version) {
              throw "El tag v$tagVersion no coincide con package.json ($version)"
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VENTY_RELEASE_TAG=v$version"
          Write-Host "Version de Venty: $version"

      - name: Configure GitHub update provider
        run: |
          @'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.build ??= {};
          p.build.publish = {
            provider: 'github',
            owner: 'Jesus123780',
            repo: 'front-admin-storev2',
            releaseType: 'draft'
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          '@ | Set-Content -Path configure-publisher.cjs -Encoding utf8
          node configure-publisher.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la configuracion de publicacion' }

      # Conservamos el workaround que ya permitio compilar Next.js.
      - name: Build Next.js standalone on C drive
        run: |
          $source = $env:GITHUB_WORKSPACE
          $mirror = "C:\venty-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $mirror -Force | Out-Null
          Write-Host "Frontend de origen: $source"
          Write-Host "Compilacion aislada: $mirror"

          & robocopy $source $mirror /E /R:2 /W:2 /XD '.git' 'node_modules' '.next' 'backend-source' 'dist' 'build' 'front-back-server'
          if ($LASTEXITCODE -ge 8) {
            throw "Fallo copiar frontend a C: (robocopy $LASTEXITCODE)"
          }
          $global:LASTEXITCODE = 0

          Push-Location $mirror
          try {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Fallo npm ci en C:' }

            npm run next:build
            if ($LASTEXITCODE -ne 0) { throw 'Fallo Next.js en C:' }

            if (-not (Test-Path '.next/standalone/server.js' -PathType Leaf)) {
              throw 'No se genero .next/standalone/server.js'
            }
          } finally {
            Pop-Location
          }

          $builtNext = Join-Path $mirror '.next'
          $targetNext = Join-Path $source '.next'
          if (Test-Path $targetNext) {
            Remove-Item $targetNext -Recurse -Force
          }
          New-Item -ItemType Directory -Path $targetNext -Force | Out-Null
          & robocopy $builtNext $targetNext /E /R:2 /W:2
          if ($LASTEXITCODE -ge 8) {
            throw "Fallo devolver .next al workspace (robocopy $LASTEXITCODE)"
          }
          $global:LASTEXITCODE = 0

          if (-not (Test-Path (Join-Path $targetNext 'standalone/server.js') -PathType Leaf)) {
            throw 'No se encontro standalone/server.js despues de copiar'
          }
          Write-Host 'Next.js compilado y copiado correctamente.'

      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          repository: foodi-app-org/front-back-server
          ref: main
          path: backend-source
          persist-credentials: false

      - name: Setup Python 3.11
        id: python311
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install backend dependencies
        working-directory: backend-source
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          NODE_GYP_FORCE_PYTHON: ${{ steps.python311.outputs.python-path }}
          PYTHON: ${{ steps.python311.outputs.python-path }}
          npm_config_python: ${{ steps.python311.outputs.python-path }}
        run: |
          $python = $env:NODE_GYP_FORCE_PYTHON
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "No existe el Python seleccionado: $python"
          }
          & $python -c "import sys; import distutils.version; assert sys.version_info[:2] == (3, 11), sys.version; print(sys.executable); print(sys.version)"
          if ($LASTEXITCODE -ne 0) {
            throw 'node-gyp necesita Python 3.11 con distutils'
          }
          Write-Host "Python fijado para node-gyp: $python"

          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Fallo npm ci del backend' }

      - name: Compile backend TypeScript and GraphQL
        working-directory: backend-source
        run: |
          npm run prepare-build
          if ($LASTEXITCODE -ne 0) { throw 'Fallo prepare-build del backend' }
          if (-not (Test-Path 'build/server.js' -PathType Leaf)) {
            throw 'No se genero build/server.js'
          }

      - name: Configure backend pkg for CI
        working-directory: backend-source
        run: |
          if (Test-Path '.env') { Remove-Item '.env' -Force }
          @'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.bin = { server: 'build/server.js' };
          p.pkg = {
            scripts: ['build/**/*.js'],
            assets: [
              'build/**/*.gql',
              'build/**/*.graphql',
              'public/**/*',
              'config/**/*',
              'src/api/lib/types/**/*',
              'build/api/lib/types/**/*',
              'node_modules/sequelize/lib/**/*.js',
              'node_modules/sqlite3/**/*'
            ],
            targets: ['node22-win-x64']
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          '@ | Set-Content -Path configure-pkg.cjs -Encoding utf8
          node configure-pkg.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Fallo configuracion de pkg' }

      - name: Build backend Windows executable
        working-directory: backend-source
        run: |
          npx --yes @yao-pkg/pkg@6.25.0 . --sea --targets node22-win-x64 --output dist/front-back-server.exe
          if ($LASTEXITCODE -ne 0) { throw 'Fallo empaquetado del backend' }

      - name: Copy and validate backend executable
        run: |
          $source = 'backend-source/dist/front-back-server.exe'
          $target = 'front-back-server/front-back-server.exe'
          if (-not (Test-Path $source -PathType Leaf)) { throw "Falta $source" }
          New-Item -ItemType Directory -Path 'front-back-server' -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination $target -Force
          $exe = Get-Item $target
          if ($exe.Length -le 1024) { throw 'El ejecutable no parece valido' }
          $stream = [System.IO.File]::OpenRead((Resolve-Path $target).Path)
          try {
            $mz0 = $stream.ReadByte()
            $mz1 = $stream.ReadByte()
          } finally {
            $stream.Dispose()
          }
          if ($mz0 -ne 77 -or $mz1 -ne 90) {
            throw 'El ejecutable no es un archivo PE de Windows (MZ)'
          }
          Write-Host "Backend generado: $target ($($exe.Length) bytes)"

      - name: Compile Electron
        run: |
          npm run electron:compile
          if ($LASTEXITCODE -ne 0) { throw 'Fallo compilacion de Electron' }

      - name: Validate build assets
        run: |
          @(
            'build/main.js',
            'build/preload.js',
            'build/start.dev.js',
            '.next/standalone/server.js',
            'front-back-server/front-back-server.exe'
          ) | ForEach-Object {
            if (-not (Test-Path $_ -PathType Leaf)) {
              throw "Falta el archivo $_"
            }
          }

      # Ejecucion manual: solo instalador descargable, NO release.
      - name: Build test installer (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Fallo el instalador de prueba' }
          if (-not (Get-ChildItem 'dist/*.exe' -ErrorAction SilentlyContinue)) {
            throw 'No se genero ningun instalador .exe'
          }

      - name: Upload test installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Venty-Windows-Test-${{ github.run_id }}
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

      # Solo un push de tag publica una actualizacion.
      - name: Ensure release is new
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:VENTY_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "La release $env:VENTY_RELEASE_TAG ya existe"
          }
          $global:LASTEXITCODE = 0

      - name: Build and publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win nsis --publish always
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la publicacion de Electron Builder' }
          if (-not (Test-Path 'dist/latest.yml' -PathType Leaf)) {
            throw 'No se genero latest.yml; no se publicara la release'
          }
          gh release edit $env:VENTY_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Fallo activar GitHub Release' }
          Write-Host "Release publicada: $env:VENTY_RELEASE_TAG"
