name: Venty - Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: venty-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and publish Windows NSIS
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure release version
        shell: pwsh
        run: |
          $baseVersion = node -p "require('./package.json').version"
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "La version del frontend debe ser X.Y.Z: $baseVersion"
          }

          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $parts = $baseVersion.Split('.')
            $patch = [int]$parts[2] + [int]$env:GITHUB_RUN_NUMBER
            $version = "$($parts[0]).$($parts[1]).$patch"
            npm version $version --no-git-tag-version --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw "No se pudo fijar la version $version" }
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -ne $baseVersion) {
              throw "El tag v$version no coincide con package.json ($baseVersion)"
            }
          } else {
            $version = $baseVersion
          }

          Add-Content -Path $env:GITHUB_ENV -Value "VENTY_RELEASE_TAG=v$version"
          Write-Host "Version del instalador: $version"

      - name: Configure GitHub update feed
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.build ??= {};
          p.build.publish = {
            provider: 'github',
            owner: 'Jesus123780',
            repo: 'front-admin-storev2',
            releaseType: 'draft'
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          '@ | Set-Content -Path configure-publisher.cjs -Encoding utf8
          node configure-publisher.cjs

      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          repository: foodi-app-org/front-back-server
          ref: main
          path: backend-source
          persist-credentials: false

      # node-gyp 8 (utilizado por sqlite3) requiere distutils,
      # que no esta incluido en Python 3.12.
      - name: Setup Python 3.11 for native backend modules
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install backend dependencies
        working-directory: backend-source
        shell: pwsh
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          $python = (Get-Command python).Source
          Write-Host "Python: $python"
          python --version
          python -c "import distutils; print('distutils OK')"
          if ($LASTEXITCODE -ne 0) {
            throw 'Python 3.11 no tiene distutils disponible'
          }

          $env:NODE_GYP_FORCE_PYTHON = $python
          $env:npm_config_python = $python

          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            throw 'Fallo npm ci del backend'
          }

      - name: Compile backend TypeScript and GraphQL
        working-directory: backend-source
        shell: pwsh
        run: |
          npm run prepare-build
          if ($LASTEXITCODE -ne 0) { throw 'Fallo prepare-build del backend' }
          if (-not (Test-Path 'build/server.js' -PathType Leaf)) {
            throw 'No se genero build/server.js'
          }

      - name: Prepare backend packaging config (CI only)
        working-directory: backend-source
        shell: pwsh
        run: |
          # Nunca incluir secretos ni datos locales de clientes en el instalador.
          if (Test-Path '.env') { Remove-Item '.env' -Force }

          @'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.bin = { server: 'build/server.js' };
          p.pkg = {
            scripts: ['build/**/*.js'],
            assets: [
              'build/**/*.gql',
              'build/**/*.graphql',
              'public/**/*',
              'config/**/*',
              'src/api/lib/types/**/*',
              'build/api/lib/types/**/*',
              'node_modules/sequelize/lib/**/*.js',
              'node_modules/sqlite3/**/*'
            ],
            ignore: ['.env', '**/.env', '**/.env.*', 'uploads/**/*'],
            targets: ['node22-win-x64']
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          '@ | Set-Content -Path configure-pkg.cjs -Encoding utf8
          node configure-pkg.cjs

      - name: Build backend Windows executable
        working-directory: backend-source
        shell: pwsh
        run: |
          npx --yes @yao-pkg/pkg@6.25.0 . --sea --targets node22-win-x64 --output dist/front-back-server.exe
          if ($LASTEXITCODE -ne 0) { throw 'Fallo el empaquetado del backend' }

      - name: Copy and validate backend executable
        shell: pwsh
        run: |
          $source = 'backend-source/dist/front-back-server.exe'
          $target = 'front-back-server/front-back-server.exe'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "No existe el backend compilado: $source"
          }
          New-Item -ItemType Directory -Force -Path 'front-back-server' | Out-Null
          Copy-Item -LiteralPath $source -Destination $target -Force
          $file = Get-Item -LiteralPath $target
          if ($file.Length -eq 0) { throw 'El backend ejecutable esta vacio' }
          Write-Host "Backend listo: $target ($($file.Length) bytes)"

      - name: Build Next.js standalone
        run: npm run next:build

      - name: Compile Electron
        run: npm run electron:compile

      - name: Validate compilation
        shell: pwsh
        run: |
          $required = @(
            'build/main.js',
            'build/preload.js',
            'build/start.dev.js',
            '.next/standalone/server.js',
            'front-back-server/front-back-server.exe'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Falta el archivo: $file"
            }
          }
          Write-Host 'Compilacion validada.'

      - name: Build Windows test installer (manual)
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-builder --win nsis --publish never

      - name: Upload test installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Venty-Windows-Test-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Check release does not already exist
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:VENTY_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Ya existe el release $env:VENTY_RELEASE_TAG. No se sobrescribira."
          }

      - name: Build and upload GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          npx electron-builder --win nsis --publish always
          if ($LASTEXITCODE -ne 0) { throw 'electron-builder no pudo publicar' }
          if (-not (Test-Path 'dist/latest.yml' -PathType Leaf)) {
            throw 'No se genero dist/latest.yml; no se publicara la release.'
          }

          gh release edit $env:VENTY_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la release (salir de borrador)' }
          Write-Host "Release publicada: $env:VENTY_RELEASE_TAG"
