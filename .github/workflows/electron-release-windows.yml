name: Venty - Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: venty-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows NSIS
    runs-on: windows-2022
    timeout-minutes: 150

    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NEXT_TELEMETRY_DISABLED: '1'

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Fallo npm ci del frontend' }

      - name: Configure release version
        run: |
          $base = node -p "require('./package.json').version"
          if ($base -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version base no admitida: $base"
          }
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $parts = $base.Split('.')
            $patch = [int]$parts[2] + [int]$env:GITHUB_RUN_NUMBER
            $version = "$($parts[0]).$($parts[1]).$patch"
            npm version $version --no-git-tag-version --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'Fallo al establecer version del build' }
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -ne $base) { throw "Tag v$version no coincide con $base" }
          } else {
            $version = $base
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VENTY_RELEASE_TAG=v$version"
          Write-Host "Version de Venty: $version"

      - name: Configure GitHub update provider
        run: |
          @'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.build ??= {};
          p.build.publish = {
            provider: 'github',
            owner: 'Jesus123780',
            repo: 'front-admin-storev2',
            releaseType: 'draft'
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          '@ | Set-Content -Path configure-publisher.cjs -Encoding utf8
          node configure-publisher.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la configuracion de publicacion' }

      # Next.js 15 puede fallar en Windows si el proyecto esta en D:
      # al seguir rutas protegidas del perfil en C:\Users.
      # Este paso crea una copia aislada del frontend en la unidad C:.
      - name: Build Next.js standalone on C drive
        run: |
          $source = $env:GITHUB_WORKSPACE
          $mirror = "C:\venty-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Write-Host "Origen: $source"
          Write-Host "Build aislado: $mirror"

          New-Item -ItemType Directory -Path $mirror -Force | Out-Null

          & robocopy $source $mirror /E /R:2 /W:2 /XD '.git' 'node_modules' '.next' 'backend-source' 'dist' 'build' 'front-back-server'
          if ($LASTEXITCODE -ge 8) { throw "Fallo copiar frontend a C: (robocopy $LASTEXITCODE)" }

          Push-Location $mirror
          try {
            Write-Host "Node: $(node --version)"
            Write-Host "Build en: $(Get-Location)"

            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Fallo npm ci en unidad C:' }

            npm run next:build
            if ($LASTEXITCODE -ne 0) { throw 'Fallo next:build en unidad C:' }

            if (-not (Test-Path '.next/standalone/server.js' -PathType Leaf)) {
              throw 'Next.js no genero .next/standalone/server.js en C:'
            }
          } finally {
            Pop-Location
          }

          $builtNext = Join-Path $mirror '.next'
          $targetNext = Join-Path $source '.next'
          if (Test-Path $targetNext) { Remove-Item $targetNext -Recurse -Force }
          New-Item -ItemType Directory -Path $targetNext -Force | Out-Null

          & robocopy $builtNext $targetNext /E /R:2 /W:2
          if ($LASTEXITCODE -ge 8) { throw "Fallo devolver .next a D: (robocopy $LASTEXITCODE)" }

          if (-not (Test-Path (Join-Path $targetNext 'standalone/server.js') -PathType Leaf)) {
            throw 'No se encontro el standalone tras copiarlo al workspace original'
          }
          Write-Host 'Next.js standalone compilado en C: y copiado a D: correctamente.'

      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          repository: foodi-app-org/front-back-server
          ref: main
          path: backend-source
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install backend dependencies
        working-directory: backend-source
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          $python = (Get-Command python).Source
          python --version
          python -c "import distutils; print('distutils OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Falta distutils; revisar Python' }
          $env:NODE_GYP_FORCE_PYTHON = $python
          $env:npm_config_python = $python
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Fallo npm ci del backend' }

      - name: Compile backend TypeScript and GraphQL
        working-directory: backend-source
        run: |
          npm run prepare-build
          if ($LASTEXITCODE -ne 0) { throw 'Fallo prepare-build del backend' }
          if (-not (Test-Path 'build/server.js' -PathType Leaf)) {
            throw 'No se genero build/server.js'
          }

      - name: Configure backend pkg for CI
        working-directory: backend-source
        run: |
          if (Test-Path '.env') { Remove-Item '.env' -Force }
          @'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.bin = { server: 'build/server.js' };
          p.pkg = {
            scripts: ['build/**/*.js'],
            assets: [
              'build/**/*.gql',
              'build/**/*.graphql',
              'public/**/*',
              'config/**/*',
              'src/api/lib/types/**/*',
              'build/api/lib/types/**/*',
              'node_modules/sequelize/lib/**/*.js',
              'node_modules/sqlite3/**/*'
            ],
            targets: ['node22-win-x64']
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          '@ | Set-Content -Path configure-pkg.cjs -Encoding utf8
          node configure-pkg.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Fallo configuracion de pkg' }

      - name: Build backend Windows executable
        working-directory: backend-source
        run: |
          npx --yes @yao-pkg/pkg@6.25.0 . --sea --targets node22-win-x64 --output dist/front-back-server.exe
          if ($LASTEXITCODE -ne 0) { throw 'Fallo empaquetado del backend' }

      - name: Copy and validate backend executable
        run: |
          $source = 'backend-source/dist/front-back-server.exe'
          $target = 'front-back-server/front-back-server.exe'
          if (-not (Test-Path $source -PathType Leaf)) { throw "Falta $source" }
          New-Item -ItemType Directory -Path 'front-back-server' -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination $target -Force
          $exe = Get-Item $target
          if ($exe.Length -le 1024) { throw 'El ejecutable no parece valido' }
          $stream = [System.IO.File]::OpenRead((Resolve-Path $target).Path)
          try {
            $mz0 = $stream.ReadByte()
            $mz1 = $stream.ReadByte()
          } finally {
            $stream.Dispose()
          }
          if ($mz0 -ne 77 -or $mz1 -ne 90) { throw 'El ejecutable no es un PE de Windows (MZ)' }
          Write-Host "Backend listo: $target ($($exe.Length) bytes)"

      - name: Compile Electron
        run: |
          npm run electron:compile
          if ($LASTEXITCODE -ne 0) { throw 'Fallo tsup de Electron' }

      - name: Validate build assets
        run: |
          @(
            'build/main.js',
            'build/preload.js',
            'build/start.dev.js',
            '.next/standalone/server.js',
            'front-back-server/front-back-server.exe'
          ) | ForEach-Object {
            if (-not (Test-Path $_ -PathType Leaf)) { throw "Falta archivo $_" }
          }

      - name: Build test installer (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Fallo electron-builder en modo prueba' }

      - name: Upload test installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Venty-Windows-Test-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Ensure release is new
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:VENTY_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "La release $env:VENTY_RELEASE_TAG ya existe. No se reemplazara."
          }

      - name: Build and publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win nsis --publish always
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la publicacion de Electron Builder' }
          if (-not (Test-Path 'dist/latest.yml' -PathType Leaf)) {
            throw 'No se genero latest.yml; no se habilitara el update'
          }
          gh release edit $env:VENTY_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la activacion de GitHub Release' }
