
name: Venty - Windows Release

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows NSIS
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Show environment
        shell: pwsh
        run: |
          node --version
          npm --version
          Write-Host "Commit: $env:GITHUB_SHA"

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = node -p "require('./package.json').version"

          if ($tag -ne "v$version") {
            throw "El tag $tag no coincide con la version $version"
          }

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Este archivo debe llegar desde el repositorio
      # o descargarse desde un artefacto del backend.
      - name: Validate backend executable
        shell: pwsh
        run: |
          $exe = 'front-back-server/front-back-server.exe'

          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "No existe $exe. Debes incorporar el ejecutable del backend al workflow antes de generar el instalador."
          }

          $file = Get-Item $exe

          if ($file.Length -eq 0) {
            throw "El backend ejecutable esta vacio."
          }

          Write-Host "Backend encontrado: $($file.Length) bytes"

      - name: Build Next.js standalone
        run: npm run next:build

      - name: Compile Electron
        run: npm run electron:compile

      - name: Validate compilation
        shell: pwsh
        run: |
          $required = @(
            'build/main.js',
            'build/preload.js',
            'build/start.dev.js',
            '.next/standalone/server.js'
          )

          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Falta el archivo: $file"
            }
          }

          Write-Host "Compilacion validada."

      # Ejecución manual: genera un instalador de prueba.
      - name: Build Windows test installer
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-builder --win nsis --publish never

      - name: Upload test installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Venty-Windows-Test-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      # Ejecución por tag: publica la Release.
      - name: Publish Windows Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
