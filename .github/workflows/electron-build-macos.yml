name: Venty - macOS Release (manual, sin firma)

# Manual: compila artefactos sin publicar. Tag v*: adjunta DMG/ZIP a la Release de Windows.
# Los builds NO estan firmados y NO se publican como actualizaciones electron-updater.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: venty-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MAC_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python 3.11
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install frontend
        run: npm ci --no-audit --no-fund

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version no admitida: $version" >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            [[ "$GITHUB_REF_NAME" == "v${version}" ]] || {
              echo "El tag $GITHUB_REF_NAME no coincide con package.json ($version)" >&2
              exit 1
            }
          fi
          echo "VENTY_RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
          echo "Venty ${version} macOS ${MAC_ARCH}: paquete SIN firma de Apple"

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: foodi-app-org/front-back-server
          ref: main
          path: backend-source
          persist-credentials: false

      - name: Install backend dependencies
        working-directory: backend-source
        env:
          NODE_GYP_FORCE_PYTHON: ${{ steps.python.outputs.python-path }}
          PYTHON: ${{ steps.python.outputs.python-path }}
          npm_config_python: ${{ steps.python.outputs.python-path }}
        run: npm ci --no-audit --no-fund

      - name: Compile backend
        working-directory: backend-source
        run: |
          set -euo pipefail
          npm run prepare-build
          test -f build/server.js

      - name: Configure backend executable
        working-directory: backend-source
        run: |
          set -euo pipefail
          rm -f .env
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.bin = { server: 'build/server.js' }
          pkg.pkg = {
            scripts: ['build/**/*.js'],
            assets: [
              'build/**/*.gql',
              'build/**/*.graphql',
              'public/**/*',
              'config/**/*',
              'src/api/lib/types/**/*',
              'build/api/lib/types/**/*',
              'node_modules/sequelize/lib/**/*.js',
              'node_modules/sqlite3/**/*'
            ]
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Build macOS backend
        working-directory: backend-source
        run: |
          set -euo pipefail
          mkdir -p ../front-back-server
          npx --yes @yao-pkg/pkg@6.25.0 . \
            --sea \
            --targets "node22-macos-${MAC_ARCH}" \
            --output "../front-back-server/front-back-server-mac-${MAC_ARCH}"
          chmod +x "../front-back-server/front-back-server-mac-${MAC_ARCH}"
          test -s "../front-back-server/front-back-server-mac-${MAC_ARCH}"

      - name: Build Next.js
        run: |
          set -euo pipefail
          npm run next:build
          test -f .next/standalone/server.js

      - name: Compile Electron
        run: |
          set -euo pipefail
          npm run electron:compile
          test -f build/main.js
          test -f build/preload.js

      - name: Configure unsigned macOS packaging
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-mac-build.cjs
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
          pkg.build ??= {}
          pkg.build.mac ??= {}
          // No publicar directamente desde los dos runners.
          pkg.build.publish = [{
            provider: 'github',
            owner: 'Jesus123780',
            repo: 'front-admin-storev2'
          }]
          // Nombres diferenciados para evitar colisiones entre arquitecturas.
          pkg.build.mac.artifactName = 'Venty-${version}-mac-${arch}.${ext}'
          // Modo SIN certificado Apple. NO apto para auto-instalacion de Electron.
          pkg.build.forceCodeSigning = false
          pkg.build.mac.identity = null
          pkg.build.mac.notarize = false
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Build unsigned macOS DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --mac dmg zip --"${MAC_ARCH}" --publish never

      - name: Validate unsigned DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dmg="dist/Venty-${version}-mac-${MAC_ARCH}.dmg"
          zip="dist/Venty-${version}-mac-${MAC_ARCH}.zip"
          test -s "$dmg" || { echo "Falta $dmg" >&2; exit 1; }
          test -s "$zip" || { echo "Falta $zip" >&2; exit 1; }
          ls -lh "$dmg" "$zip"
          echo 'Instaladores sin firma generados correctamente.'
          echo 'No se adjunta latest-mac.yml: no son autoactualizaciones instalables.'

      - name: Upload unsigned macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Venty-macOS-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-macos:
    name: Attach unsigned Mac installers to Windows Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Download Intel and Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Venty-macOS-*-${{ github.run_id }}
          path: downloaded
          merge-multiple: false

      - name: Verify files and generate SHA512 checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import os
          import shutil
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          assert tag.startswith('v')
          version = tag[1:]
          run_id = os.environ['GITHUB_RUN_ID']
          output = Path('release-files')
          output.mkdir(exist_ok=True)
          checksums = []

          for arch in ('x64', 'arm64'):
              source = Path('downloaded') / f'Venty-macOS-{arch}-{run_id}'
              for extension in ('dmg', 'zip'):
                  name = f'Venty-{version}-mac-{arch}.{extension}'
                  file = source / name
                  if not file.is_file() or file.stat().st_size < 1024:
                      raise SystemExit(f'Falta instalador de {arch}: {file}')
                  target = output / name
                  shutil.copy2(file, target)
                  sha = hashlib.sha512()
                  with target.open('rb') as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                          sha.update(chunk)
                  digest = sha.hexdigest()
                  checksums.append(f'{digest}  {name}')

          # NO crear latest-mac.yml: macOS autoUpdater necesita apps firmadas.
          (output / 'SHA512SUMS-macOS.txt').write_text(
              '\n'.join(checksums) + '\n', encoding='utf-8'
          )
          print('Archivos validados:', *(p.name for p in output.iterdir()), sep='\n- ')
          PY

      - name: Wait for Windows workflow to publish the same Release
        shell: bash
        run: |
          set -euo pipefail
          # Windows sigue siendo el propietario de la Release v*.
          # Crear otra Release aqui romperia el paso Ensure release is new de Windows.
          for attempt in $(seq 1 100); do
            published="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [[ "$published" == 'false' ]]; then
              echo "Release $RELEASE_TAG lista: se adjuntaran DMG/ZIP sin firma."
              exit 0
            fi
            echo "Esperando publicacion de Windows ($attempt/100)"
            sleep 60
          done
          echo "Windows no publico $RELEASE_TAG. Verifica Venty - Windows Release." >&2
          echo 'No se creo una segunda Release para no afectar el pipeline Windows.' >&2
          exit 1

      - name: Publish unsigned macOS installers (manual installation only)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-files/*.dmg release-files/*.zip release-files/SHA512SUMS-macOS.txt)
          [[ ${#assets[@]} -eq 5 ]] || {
            echo 'Se esperaban exactamente 2 DMG, 2 ZIP y un archivo SHA512.' >&2
            exit 1
          }
          # Solo se reemplazan los assets Mac, nunca los instaladores Windows.
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Archivos publicados en $RELEASE_TAG:"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name'
          echo 'AVISO: Mac instalacion manual. No hay actualizaciones automaticas sin firma.'
